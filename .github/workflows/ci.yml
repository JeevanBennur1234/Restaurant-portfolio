name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Suite
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          SITE: customer
          PAYMENTS_MODE: counter_only
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dinepulse_build
          NEXT_PUBLIC_APP_URL: https://example.com
          SESSION_SECRET: ci-build-session-secret-at-least-32-characters-long
          NEXT_PUBLIC_SUPABASE_URL: https://mock-ci-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-supabase-anon-key-token
          SUPABASE_SERVICE_ROLE_KEY: ci-build-supabase-service-role-token

  e2e:
    name: End-to-End Tests (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dinepulse_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Suite
        run: npx playwright test --project=chromium
        env:
          CI: "true"
          E2E_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/dinepulse_e2e
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          SESSION_SECRET: e2e-fixed-test-session-secret-at-least-32-chars-long
          SITE: all
          PAYMENTS_MODE: online
          RAZORPAY_KEY_ID: rzp_test_e2e_test_key
          RAZORPAY_KEY_SECRET: e2e_test_secret_32_characters_long
          RAZORPAY_WEBHOOK_SECRET: e2e_test_webhook_secret_32_chars

      - name: Upload Playwright Report & Traces on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
