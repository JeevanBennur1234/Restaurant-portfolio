<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="storyEmber" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#854D0E" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#5B2914" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#2E2723" stop-opacity="1" />
      <stop offset="100%" stop-color="#181311" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="tandoorWarmth" cx="60%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#9A3412" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#2E2723" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="storyBottomShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#181311" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="#181311" />
  <rect width="1200" height="900" fill="url(#storyEmber)" />
  <circle cx="700" cy="400" r="380" fill="url(#tandoorWarmth)" />

  <!-- Subtle Tandoor / Arch Motif Linework -->
  <g stroke="#FAF7F2" stroke-opacity="0.08" stroke-width="1.5" fill="none">
    <circle cx="600" cy="450" r="220" />
    <circle cx="600" cy="450" r="320" stroke-dasharray="6 10" />
    <path d="M 400 650 Q 600 250 800 650" stroke-opacity="0.06" />
  </g>

  <rect width="1200" height="900" fill="url(#storyBottomShade)" />

  <g text-anchor="middle" font-family="'Playfair Display', Georgia, serif">
    <text x="600" y="420" font-size="16" letter-spacing="6" fill="#D97706" font-family="system-ui, sans-serif" font-weight="600" text-transform="uppercase">
      HERITAGE ARCHIVE · 1947
    </text>
    <text x="600" y="475" font-size="44" font-weight="700" fill="#FAF7F2" fill-opacity="0.95" letter-spacing="1">
      The Old Delhi Makhani
    </text>
    <text x="600" y="515" font-size="14" letter-spacing="4" fill="#FAF7F2" fill-opacity="0.6" font-family="system-ui, sans-serif" font-weight="500" text-transform="uppercase">
      Slow Simmered Over Charcoal Embers
    </text>
  </g>
</svg>
