<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Warm Editorial Gradient: Espresso #2E2723, Deep Amber #78350F, Saffron #D97706 -->
    <radialGradient id="emberGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#451A03" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#2E2723" stop-opacity="1" />
      <stop offset="100%" stop-color="#1A1513" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="saffronAccent" cx="60%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#B45309" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="overlayFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1A1513" stop-opacity="0.8" />
    </linearGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="2400" height="1350" fill="#1A1513" />
  <rect width="2400" height="1350" fill="url(#emberGlow)" />
  <circle cx="1400" cy="550" r="500" fill="url(#saffronAccent)" filter="url(#softBlur)" />

  <!-- Subtle Geometric Architectural Linework (Sigdi & Tandoor Embers Motif) -->
  <g stroke="#FAF7F2" stroke-opacity="0.06" stroke-width="1.5" fill="none">
    <circle cx="1200" cy="675" r="320" />
    <circle cx="1200" cy="675" r="480" stroke-dasharray="8 12" />
    <circle cx="1200" cy="675" r="640" stroke-opacity="0.04" />
    <line x1="200" y1="675" x2="2200" y2="675" stroke-dasharray="6 14" stroke-opacity="0.03" />
    <line x1="1200" y1="150" x2="1200" y2="1200" stroke-dasharray="6 14" stroke-opacity="0.03" />
  </g>

  <!-- Dark Top/Bottom Contrast Gradient for WCAG AA Accessibility -->
  <rect width="2400" height="1350" fill="url(#overlayFade)" />

  <!-- Clean hero background: retain only the warm gradient and subtle geometric linework. -->
</svg>
